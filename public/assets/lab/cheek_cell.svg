<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="cheekShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <radialGradient id="cytoplasmGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a4a5a"/>
      <stop offset="100%" stop-color="#2a3a4a"/>
    </radialGradient>
    <radialGradient id="nucleusGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a3a5a"/>
      <stop offset="100%" stop-color="#3a2a4a"/>
    </radialGradient>
  </defs>
  
  <rect width="800" height="600" fill="#0a0e1a"/>
  
  <g filter="url(#cheekShadow)">
    <g id="cells">
      <g class="cell" transform="translate(200, 200)">
        <ellipse cx="0" cy="0" rx="120" ry="90" fill="url(#cytoplasmGrad)" stroke="#5a6a7a" stroke-width="2" opacity="0.8"/>
        <ellipse cx="0" cy="0" rx="115" ry="85" fill="url(#cytoplasmGrad)" stroke="none" opacity="0.6"/>
        <ellipse cx="-10" cy="-15" rx="45" ry="38" fill="url(#nucleusGrad)" stroke="#5a4a6a" stroke-width="3"/>
        <ellipse cx="-10" cy="-15" rx="40" ry="33" fill="#5a3a7a" stroke="none" opacity="0.9"/>
        <ellipse cx="-15" cy="-20" rx="12" ry="10" fill="#2a1a3a"/>
        <circle cx="-8" cy="-10" r="3" fill="#6a5a8a" opacity="0.8"/>
        <circle cx="20" cy="10" r="3" fill="#5a6a7a" opacity="0.5"/>
        <circle cx="-30" cy="25" r="2" fill="#5a6a7a" opacity="0.5"/>
        <circle cx="15" cy="-30" r="2" fill="#5a6a7a" opacity="0.5"/>
      </g>
      
      <g class="cell" transform="translate(500, 200)">
        <ellipse cx="0" cy="0" rx="110" ry="85" fill="url(#cytoplasmGrad)" stroke="#5a6a7a" stroke-width="2" opacity="0.8"/>
        <ellipse cx="0" cy="0" rx="105" ry="80" fill="url(#cytoplasmGrad)" stroke="none" opacity="0.6"/>
        <ellipse cx="5" cy="-10" rx="42" ry="35" fill="url(#nucleusGrad)" stroke="#5a4a6a" stroke-width="3"/>
        <ellipse cx="5" cy="-10" rx="37" ry="30" fill="#5a3a7a" stroke="none" opacity="0.9"/>
        <ellipse cx="0" cy="-15" rx="11" ry="9" fill="#2a1a3a"/>
        <circle cx="10" cy="-5" r="3" fill="#6a5a8a" opacity="0.8"/>
