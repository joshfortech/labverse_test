    <g id="bacteria" fill="#5a6a7a" opacity="0.4">
      <circle cx="150" cy="300" r="2"/>
      <circle cx="400" cy="150" r="1.5"/>
      <circle cx="650" cy="350" r="2"/>
      <circle cx="200" cy="500" r="1.5"/>
      <circle cx="700" cy="100" r="2"/>
      <circle cx="300" cy="500" r="1.5"/>
      <circle cx="550" cy="550" r="2"/>
