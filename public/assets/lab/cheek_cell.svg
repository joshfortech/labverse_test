        <ellipse cx="-3" cy="2" rx="30" ry="25" fill="url(#nucleusGrad)" stroke="#5a4a6a" stroke-width="2"/>
        <ellipse cx="-3" cy="2" rx="25" ry="20" fill="#5a3a7a" stroke="none" opacity="0.9"/>
        <ellipse cx="-8" cy="-3" rx="8" ry="6" fill="#2a1a3a"/>
