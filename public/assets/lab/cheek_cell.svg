        <ellipse cx="0" cy="0" rx="90" ry="65" fill="url(#cytoplasmGrad)" stroke="none" opacity="0.6"/>
        <ellipse cx="8" cy="-5" rx="35" ry="28" fill="url(#nucleusGrad)" stroke="#5a4a6a" stroke-width="3"/>
        <ellipse cx="8" cy="-5" rx="30" ry="23" fill="#5a3a7a" stroke="none" opacity="0.9"/>
        <ellipse cx="13" cy="-10" rx="9" ry="7" fill="#2a1a3a"/>
