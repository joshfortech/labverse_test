        <circle cx="30" cy="20" r="2" fill="#5a6a7a" opacity="0.5"/>
      </g>
      
      <g class="cell" transform="translate(350, 400)">
        <ellipse cx="0" cy="0" rx="100" ry="75" fill="url(#cytoplasmGrad)" stroke="#5a6a7a" stroke-width="2" opacity="0.8"/>
        <ellipse cx="0" cy="0" rx="95" ry="70" fill="url(#cytoplasmGrad)" stroke="none" opacity="0.6"/>
        <ellipse cx="-5" cy="5" rx="38" ry="32" fill="url(#nucleusGrad)" stroke="#5a4a6a" stroke-width="3"/>
